services:
  miscale:
    build: .
    image: miscale-dashboard:local
    container_name: miscale-dashboard
    restart: unless-stopped
    # 时区、通知与可选 AI 分析等配置来自 .env，参考 .env.example。
    env_file:
      - path: .env
        required: false
    ports:
      - "8800:8800"
    volumes:
      # 数据库与用户照片。
      - ./data:/data
      # 蓝牙扫描通过系统 D-Bus 访问主机的 BlueZ。
      - /run/dbus:/run/dbus:ro
    security_opt:
      # Docker 默认 AppArmor 规则阻止 D-Bus，需要允许访问。
      - apparmor=unconfined
